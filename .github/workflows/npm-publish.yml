name: Publish package to npm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      publish_mode:
        description: Select auth mode for manual publish
        required: true
        default: trusted
        type: choice
        options:
          - trusted
          - token

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify package
        run: npm publish --dry-run --ignore-scripts --access public

      - name: Publish to npm (trusted publishing)
        if: ${{ github.event_name == 'push' || inputs.publish_mode == 'trusted' }}
        run: npm publish --ignore-scripts --access public

      - name: Publish to npm (token fallback)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_mode == 'token' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --ignore-scripts --access public